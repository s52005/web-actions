name: fetch IP
on:
  push:
    branches:
      - main
jobs:
  fetch-ip:
    name: Fetch IP
    runs-on: ubuntu-latest
    steps:
      - run: cat /etc/os-release
      - run: curl httpbin.org/ip
      - run: echo ${{ secrets.MY_SECRET }} | tee /tmp/file
      - run: cat /tmp/file
      - run: echo "hello-world"
